name: EPUB Independent Cover Replacer

on:
  push:
    paths:
      - 'books/**'
  workflow_dispatch: # 允許手動強制啟動

jobs:
  replace-cover:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clone Code
      uses: actions/checkout@v4

    - name: 2. Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Core Processing (精準結構攔截與 HTML 滿版防變形注入)
      run: |
        python -c "
        import os, zipfile, re, shutil
        
        cover_file = None
        target_epub = None
        # 尋找使用者放在 books 資料夾內的新封面與任何 EPUB 檔案
        for f in os.listdir('books'):
            if f.lower().endswith(('.jpg', '.jpeg', '.png')):
                cover_file = os.path.join('books', f)
            elif f.lower().endswith('.epub') and not f.endswith('_[新封面].epub'):
                target_epub = os.path.join('books', f)
                
        if cover_file and target_epub:
            print(f'📖 尋找到目標電子書: {target_epub}')
            print(f'🖼️ 尋找到全新封面圖片: {cover_file}')
            print(f'開始從 EPUB 核心結構中尋找真實封面路徑...')
            
            temp_zip = 'temp_extract'
            if os.path.exists(temp_zip): shutil.rmtree(temp_zip)
            
            with zipfile.ZipFile(target_epub, 'r') as z:
                z.extractall(temp_zip)
            
            # 第一步：讀取 .opf 尋找實際封面的圖片路徑與 HTML 封面網頁路徑
            opf_path = None
            cover_img_rel_path = None
            cover_html_rel_path = None
            
            for root, dirs, files in os.walk(temp_zip):
                for file in files:
                    if file.endswith('.opf'):
                        opf_path = os.path.join(root, file)
                        break
            
            if opf_path:
                opf_dir = os.path.dirname(opf_path)
                with open(opf_path, 'r', encoding='utf-8', errors='ignore') as f_opf:
                    opf_content = f_opf.read()
                
                # 透過多種常見標籤特徵精準搜尋封面圖片 ID
                img_id = None
                img_id_match = re.search(r'<meta[^>]*name=\"cover\"[^>]*content=\"([^\"]+)\"', opf_content)
                if img_id_match:
                    img_id = img_id_match.group(1)
                
                # 遍歷尋找圖片與 HTML 檔路徑
                for item in re.findall(r'<item\s+([^>]+)>', opf_content):
                    attrs = dict(re.findall(r'(\w+)=\"([^\"]+)\"', item))
                    href = attrs.get('href')
                    media_type = attrs.get('media-type', '')
                    item_id = attrs.get('id', '')
                    properties = attrs.get('properties', '')
                    
                    # 判定為封面圖片
                    if item_id == img_id or 'cover-image' in properties or (not img_id and 'cover' in item_id.lower() and 'image' in media_type):
                        cover_img_rel_path = os.path.normpath(os.path.join(opf_dir, href))
                    # 判定為封面 HTML 網頁
                    if 'html' in media_type and ('cover' in item_id.lower() or 'cover' in href.lower()):
                        cover_html_rel_path = os.path.normpath(os.path.join(opf_dir, href))

            # 第二步：如果找到了圖片路徑，直接進行無損覆蓋
            if cover_img_rel_path and os.path.exists(cover_img_rel_path):
                shutil.copy2(cover_file, cover_img_rel_path)
                print(f'🎯 已精準替換封面圖片：{cover_img_rel_path}')
            else:
                # 備用方案：如果結構沒寫，全域強制覆蓋第一個找到的封面圖片
                for root, dirs, files in os.walk(temp_zip):
                    for file in files:
                        if 'cover' in file.lower() and file.lower().endswith(('.jpg', '.jpeg', '.png')):
                            shutil.copy2(cover_file, os.path.join(root, file))
                            print(f'➡️ 已全域替換封面圖片：{file}')

            # 第三步：注入封面 HTML 防變形控制樣式
            if cover_html_rel_path and os.path.exists(cover_html_rel_path):
                with open(cover_html_rel_path, 'r', encoding='utf-8', errors='ignore') as f_in:
                    h_content = f_in.read()
                h_content = h_content.replace('preserveAspectRatio=\"xMidYMid meet\"', 'preserveAspectRatio=\"none\"')
                h_content = h_content.replace('preserveAspectRatio=\"xMidYMid\"', 'preserveAspectRatio=\"none\"')
                if '</head>' in h_content:
                    fix_css = '<style>html, body { margin:0; padding:0; width:100%; height:100%; } svg { width:100%; height:100%; object-fit: fill; } img { width:100% !important; height:100% !important; object-fit: fill; }</style></head>'
                    h_content = h_content.replace('</head>', fix_css)
                with open(cover_html_rel_path, 'w', encoding='utf-8') as f_out:
                    f_out.write(h_content)
                print(f'已完成封面 HTML 防變形注入：{cover_html_rel_path}')

            # 第四步：重新打包回高相容性 EPUB
            base_name, _ = os.path.splitext(os.path.basename(target_epub))
            output_epub = os.path.join('books', f'{base_name}_[新封面].epub')
            
            with zipfile.ZipFile(output_epub, 'w', zipfile.ZIP_DEFLATED) as z_out:
                m_path = os.path.join(temp_zip, 'mimetype')
                if os.path.exists(m_path):
                    z_out.write(m_path, 'mimetype', compress_type=zipfile.ZIP_STORED)
                for root, dirs, files in os.walk(temp_zip):
                    for file in files:
                        fp = os.path.join(root, file)
                        an = os.path.relpath(fp, temp_zip)
                        if an != 'mimetype': z_out.write(fp, an)
            shutil.rmtree(temp_zip)
            print('🎉 獨立更換新書封與防變形重新打包完成！')
        "

    - name: 4. Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: my-cover-replaced-books
        path: |
          books/*_[新封面].epub
