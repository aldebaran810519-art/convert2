name: EPUBHV Cloud Converter

on:
  push:
    paths:
      - 'books/**'

jobs:
  convert-to-vertical:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clone Code
      uses: actions/checkout@v4

    - name: 2. Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Core Processing (Text to Vertical & Original Image Replacement)
      run: |
        python -c "
        import os, zipfile, re, shutil
        
        # 標點符號轉換對應表
        PUNCT_MAP = {
            '「': '﹃', '」': '﹄', '『': '﹁', '』': '﹂',
            '（': '︵', '）': '︶', '【': '︻', '】': '︼',
            '《': '︽', '》': '︾', '〈': '︿', '〉': '﹀',
            '〔': '︹', '〕': '︺', '—': '︱', '…': '︙'
        }
        
        # 1. 尋找使用者在 books 資料夾上傳的原始圖片與電子書
        user_image = None
        user_epub = None
        for f in os.listdir('books'):
            if f.lower().endswith(('.jpg', '.jpeg', '.png')):
                user_image = os.path.join('books', f)
            elif f.lower().endswith('.epub') and not f.endswith('_[直排].epub'):
                user_epub = os.path.join('books', f)
                
        if not user_epub:
            print('❌ 未在 books 資料夾中找到待轉檔的橫排 .epub 檔案！')
            exit(0)
            
        print(f'📖 目標電子書: {user_epub}')
        
        # 2. 解壓縮電子書到臨時工作區
        temp_dir = 'epub_workspace'
        if os.path.exists(temp_dir): shutil.rmtree(temp_dir)
        with zipfile.ZipFile(user_epub, 'r') as z:
            z.extractall(temp_dir)
            
        # 3. 處理文字、標點符號、CSS 直排設定（純文字處理，絕對不碰圖片）
        for root, dirs, files in os.walk(temp_dir):
            for file in files:
                # 修改翻頁方向
                if file.endswith('.opf'):
                    p = os.path.join(root, file)
                    with open(p, 'r', encoding='utf-8', errors='ignore') as f: content = f.read()
                    if 'page-progression-direction' not in content:
                        content = re.sub(r'<spine([^>]*)>', r'<spine\1 page-progression-direction=\"rtl\">', content)
                        with open(p, 'w', encoding='utf-8') as f: f.write(content)
                
                # 替換內文標點符號
                if file.lower().endswith(('.html', '.xhtml', '.htm')):
                    p = os.path.join(root, file)
                    with open(p, 'r', encoding='utf-8', errors='ignore') as f: content = f.read()
                    for h, v in PUNCT_MAP.items(): content = content.replace(h, v)
                    with open(p, 'w', encoding='utf-8') as f: f.write(content)
                
                # 注入直排控制樣式
                if file.lower().endswith('.css'):
                    p = os.path.join(root, file)
                    with open(p, 'a', encoding='utf-8') as f:
                        f.write('\n\nhtml { writing-mode: vertical-rl; -webkit-writing-mode: vertical-rl; -epub-writing-mode: vertical-rl; }\n')

        # 4. 【核心控制】如果使用者有給新圖片，採取「0位元變更、二進位原圖強行替代」
        if user_image:
            print(f'🖼️ 偵測到使用者上傳了新封面圖片: {user_image}，開始執行不更動原圖的覆蓋程序...')
            # 地毯式尋找原書中所有包含 cover 關鍵字或與上傳圖片格式相同的封面位置
            for root, dirs, files in os.walk(temp_dir):
                for file in files:
                    f_lower = file.lower()
                    if f_lower.endswith(('.jpg', '.jpeg', '.png')):
                        # 只要原書內的圖片包含封面特徵字樣，就用原始檔案直接覆蓋
                        if any(k in f_lower for k in ['cover', 'bookcover', 'front', 'bg', 'thumb']):
                            target_img_path = os.path.join(root, file)
                            # 採用 shutil.copy2，完整保留您上傳圖片的所有原始資訊與位元資料，不做任何圖片微調
                            shutil.copy2(user_image, target_img_path)
                            print(f'➡️ 已用您的原圖（無損變更）強行覆蓋封面圖層: {file}')

        # 5. 重新封裝回高相容性標準 EPUB
        base_name, _ = os.path.splitext(os.path.basename(user_epub))
        output_epub = os.path.join('books', f'{base_name}_[直排].epub')
        
        with zipfile.ZipFile(output_epub, 'w', zipfile.ZIP_DEFLATED) as z_out:
            m_path = os.path.join(temp_dir, 'mimetype')
            if os.path.exists(m_path):
                z_out.write(m_path, 'mimetype', compress_type=zipfile.ZIP_STORED)
            for root, dirs, files in os.walk(temp_dir):
                for file in files:
                    fp = os.path.join(root, file)
                    an = os.path.relpath(fp, temp_dir)
                    if an != 'mimetype': z_out.write(fp, an)
                    
        shutil.rmtree(temp_dir)
        print('🎉 文字橫轉直與原圖封面替換無損封裝成功！')
        "

    - name: 4. Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: my-vertical-books
        path: |
          books/*_[直排].epub
