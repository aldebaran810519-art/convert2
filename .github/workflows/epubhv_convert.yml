name: EPUBHV Cloud Converter

on:
  push:
    paths:
      - 'books/**'

jobs:
  convert-to-vertical:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clone Code
      uses: actions/checkout@v4

    - name: 2. Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install epubhv (最原始成功的開源大腦)
      run: |
        python -m pip install --upgrade pip
        pip install epubhv

    - name: 4. Core Processing (Calibre 邏輯刷新書封 -> 保持原樣轉直排)
      run: |
        # 【Calibre 邏輯核心】在轉直排前，先拆解 EPUB 並徹底刷新內部結構的封面宣告
        python -c "
        import os, zipfile, shutil, re
        
        user_image = None
        target_epub = None
        for f in os.listdir('books'):
            if f.lower().endswith(('.jpg', '.jpeg', '.png')):
                user_image = os.path.join('books', f)
            elif f.lower().endswith('.epub') and not f.endswith('-vertical.epub'):
                target_epub = os.path.join('books', f)
                
        if user_image and target_epub:
            print(f'⚙️ 啟動 Calibre 結構刷新邏輯，準備注入新封面: {user_image}')
            temp_dir = 'epub_workspace'
            if os.path.exists(temp_dir): shutil.rmtree(temp_dir)
            with zipfile.ZipFile(target_epub, 'r') as z:
                z.extractall(temp_dir)
            
            # 1. 尋找核心結構清單 content.opf
            opf_path = None
            for root, dirs, files in os.walk(temp_dir):
                for file in files:
                    if file.endswith('.opf'):
                        opf_path = os.path.join(root, file)
                        break
            
            if opf_path:
                opf_dir = os.path.dirname(opf_path)
                with open(opf_path, 'r', encoding='utf-8', errors='ignore') as f_opf:
                    opf_content = f_opf.read()
                
                # 2. 仿照 Calibre 邏輯：從結構中抓取被官方指定的封面圖片項目 ID (item id)
                img_id = None
                id_match = re.search(r'<meta[^>]*name=\"cover\"[^>]*content=\"([^\"]+)\"', opf_content)
                if id_match:
                    img_id = id_match.group(1)
                
                # 3. 遍歷結構清單，精準鎖定封面圖片的 href 檔案路徑與格式
                cover_href = None
                cover_media_type = None
                manifest_matches = re.findall(r'<item\s+([^>]+)>', opf_content)
                for item_attr in manifest_matches:
                    attrs = dict(re.findall(r'(\w+)=\"([^\"]+)\"', item_attr))
                    if attrs.get('id') == img_id or 'cover-image' in attrs.get('properties', ''):
                        cover_href = attrs.get('href')
                        cover_media_type = attrs.get('media-type')
                        break
                
                # 4. 如果藉由 Calibre 結構化分析成功抓到了路徑
                if cover_href:
                    real_img_path = os.path.normpath(os.path.join(opf_dir, cover_href))
                    if os.path.exists(real_img_path):
                        # 0位元變更無損覆蓋圖片
                        shutil.copy2(user_image, real_img_path)
                        print(f'🎯 [Calibre 邏輯] 已透過結構清單，精準定位並無損替換封面檔案: {cover_href}')
                        
                        # 5. 【關鍵修正】如果使用者上傳的副檔名與原書不同，自動刷新 .opf 裡的媒體格式宣告，防止閱讀器因格式不符不讀取
                        user_ext = os.path.splitext(user_image)[1].lower()
                        new_mime = 'image/jpeg' if user_ext in ['.jpg', '.jpeg'] else 'image/png'
                        if cover_media_type != new_mime:
                            # 替換結構清單內的 media-type，確保高相容性
                            opf_content = opf_content.replace(f'media-type=\"{cover_media_type}\"', f'media-type=\"{new_mime}\"')
                            with open(opf_path, 'w', encoding='utf-8') as f_opf_w:
                                f_opf_w.write(opf_content)
                            print(f'🔧 [Calibre 邏輯] 已同步更新內部結構的圖片媒體格式宣告為: {new_mime}')
                else:
                    # 備用方案：萬一原書根本沒宣告封面，採用地毯式同名替代法
                    for root, dirs, files in os.walk(temp_dir):
                        for file in files:
                            if file.lower().endswith(('.jpg', '.jpeg', '.png')):
                                if any(k in file.lower() for k in ['cover', 'front', 'bg', 'thumb']):
                                    shutil.copy2(user_image, os.path.join(root, file))
                                    print(f'➡️ [備用方案] 已全域覆蓋潛在封面圖片: {file}')
            
            # 6. 重新打包回橫排 EPUB
            os.remove(target_epub)
            with zipfile.ZipFile(target_epub, 'w', zipfile.ZIP_DEFLATED) as z_out:
                m_path = os.path.join(temp_dir, 'mimetype')
                if os.path.exists(m_path):
                    z_out.write(m_path, 'mimetype', compress_type=zipfile.ZIP_STORED)
                for root, dirs, files in os.walk(temp_dir):
                    for file in files:
                        fp = os.path.join(root, file)
                        an = os.path.relpath(fp, temp_dir)
                        if an != 'mimetype': z_out.write(fp, an)
            shutil.rmtree(temp_dir)
            print('🎉 封面結構刷新與覆蓋完全成功！')
        "

        # 【原封不動改直排的程式碼】完全維持您最初大獲成功的套件轉換邏輯
        for f in books/*.epub; do
          if [[ "$f" != *"-vertical.epub" ]]; then
            echo "正在以最初完美引號模式進行直排編碼: $f"
            epubhv "$f"
          fi
        done

    - name: 5. Upload Result (萬能搜刮下載路徑)
      uses: actions/upload-artifact@v4
      with:
        name: my-vertical-books
        path: |
          books/*
          *.epub
