name: EPUBHV Cloud Converter

on:
  push:
    paths:
      - 'books/**'

jobs:
  convert-to-vertical:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clone Code
      uses: actions/checkout@v4

    - name: 2. Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Core Processing (Text to Vertical & Original Image Replacement)
      run: |
        python -c "
        import os, zipfile, re, shutil
        
        # 1. 尋找使用者在 books 資料夾上傳的原始圖片與電子書
        user_image = None
        user_epub = None
        for f in os.listdir('books'):
            if f.lower().endswith(('.jpg', '.jpeg', '.png')):
                user_image = os.path.join('books', f)
            elif f.lower().endswith('.epub'):
                user_epub = os.path.join('books', f)
                
        if not user_epub:
            print('❌ 未在 books 資料夾中找到待轉檔的橫排 .epub 檔案！')
            exit(0)
            
        print(f'📖 目標電子書: {user_epub}')
        
        # 2. 解壓縮電子書到臨時工作區
        temp_dir = 'epub_workspace'
        if os.path.exists(temp_dir): shutil.rmtree(temp_dir)
        with zipfile.ZipFile(user_epub, 'r') as z:
            z.extractall(temp_dir)
            
        # 3. 處理文字與翻頁方向（原封不動保留原書的所有標點符號，絕不替換字元，防止引號躺平）
        for root, dirs, files in os.walk(temp_dir):
            for file in files:
                # 修改翻頁方向為由右至左 (RTL)
                if file.endswith('.opf'):
                    p = os.path.join(root, file)
                    with open(p, 'r', encoding='utf-8', errors='ignore') as f: content = f.read()
                    if 'page-progression-direction' not in content:
                        content = re.sub(r'<spine([^>]*)>', r'<spine\1 page-progression-direction=\"rtl\">', content)
                        with open(p, 'w', encoding='utf-8') as f: f.write(content)
                
                # 注入最純粹成功的直排樣式，讓閱讀器自動把原書標點（單引號）轉正
                if file.lower().endswith('.css'):
                    p = os.path.join(root, file)
                    with open(p, 'a', encoding='utf-8') as f:
                        f.write('\n\nhtml {\n  writing-mode: vertical-rl;\n  -webkit-writing-mode: vertical-rl;\n  -epub-writing-mode: vertical-rl;\n}\n')

        # 4. 【核心封面控制】地毯式無損掉包封面（無損覆蓋圖片，並注入防變形控制網頁）
        if user_image:
            print(f'🖼️ 偵測到新封面 {user_image}，開始執行不更動原圖的原寸覆蓋程序...')
            
            # 第一步：不管舊圖片叫什麼名字，只要有封面關鍵字，一律二進位強行原位置、原檔名替換
            for root, dirs, files in os.walk(temp_dir):
                for file in files:
                    f_lower = file.lower()
                    if f_lower.endswith(('.jpg', '.jpeg', '.png')):
                        if any(k in f_lower for k in ['cover', 'bookcover', 'front', 'bg', 'thumb', 'jacket', '00001', 'page001']):
                            target_img_path = os.path.join(root, file)
                            shutil.copy2(user_image, target_img_path)
                            print(f'➡️ 已強行全域無損覆蓋舊封面檔案: {file}')

            # 第二步：為原書的封面 HTML 網頁注入「不拉伸變形」的滿版 CSS 控制碼
            for root, dirs, files in os.walk(temp_dir):
                for file in files:
                    if file.lower().endswith(('.html', '.xhtml', '.htm')):
                        html_path = os.path.join(root, file)
                        with open(html_path, 'r', encoding='utf-8', errors='ignore') as f_h:
                            h_content = f_h.read()
                        
                        if 'cover' in file.lower() or '<svg' in h_content or 'cover' in h_content.lower():
                            h_content = h_content.replace('preserveAspectRatio=\"xMidYMid meet\"', 'preserveAspectRatio=\"none\"')
                            h_content = h_content.replace('preserveAspectRatio=\"xMidYMid\"', 'preserveAspectRatio=\"none\"')
                            
                            if '</head>' in h_content:
                                fix_style = '<style>html, body { margin:0 !important; padding:0 !important; width:100% !important; height:100% !important; overflow:hidden; } svg { width:100% !important; height:100% !important; object-fit: fill !important; } img { width:100% !important; height:100% !important; object-fit: fill !important; max-width:100% !important; }</style></head>'
                                h_content = h_content.replace('</head>', fix_style)
                            
                            with open(html_path, 'w', encoding='utf-8') as f_h_w:
                                f_h_w.write(h_content)
                            print(f'🔧 已成功為封面網頁注入防變形控制鎖: {file}')

        # 5. 重新封裝回標準 EPUB
        base_name, _ = os.path.splitext(os.path.basename(user_epub))
        output_epub = os.path.join('books', f'{base_name}_[直排].epub')
        
        with zipfile.ZipFile(output_epub, 'w', zipfile.ZIP_DEFLATED) as z_out:
            m_path = os.path.join(temp_dir, 'mimetype')
            if os.path.exists(m_path):
                z_out.write(m_path, 'mimetype', compress_type=zipfile.ZIP_STORED)
            for root, dirs, files in os.walk(temp_dir):
                for file in files:
                    fp = os.path.join(root, file)
                    an = os.path.relpath(fp, temp_dir)
                    if an != 'mimetype': z_out.write(fp, an)
                    
        shutil.rmtree(temp_dir)
        print('🎉 純文字直排與封面原圖替換無損封裝成功！')
        "

    - name: 4. Upload Result (萬能搜刮下載路徑)
      uses: actions/upload-artifact@v4
      with:
        name: my-vertical-books
        path: |
          books/*
          *.epub
