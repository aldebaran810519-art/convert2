name: EPUBHV Cloud Converter

on:
  push:
    paths:
      - 'books/**'

jobs:
  convert-to-vertical:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clone Code
      uses: actions/checkout@v4

    - name: 2. Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install epubhv (最原始成功的開源大腦)
      run: |
        python -m pip install --upgrade pip
        pip install epubhv

    - name: 4. Core Processing (智能同檔名無損換書封 -> 再用套件轉直排)
      run: |
        # 1. 呼叫 Python：在轉直排之前，先進行封面強行無損同名覆蓋
        python -c "
        import os, zipfile, shutil
        
        # 尋找使用者上傳的新封面圖片與原始橫排書
        user_image = None
        target_epub = None
        for f in os.listdir('books'):
            if f.lower().endswith(('.jpg', '.jpeg', '.png')):
                user_image = os.path.join('books', f)
            elif f.lower().endswith('.epub') and not f.endswith('-vertical.epub'):
                target_epub = os.path.join('books', f)
                
        if user_image and target_epub:
            print(f'🖼️ 偵測到新封面 {user_image}，開始對原始橫排書執行原寸無損覆蓋...')
            temp_dir = 'epub_workspace'
            if os.path.exists(temp_dir): shutil.rmtree(temp_dir)
            
            with zipfile.ZipFile(target_epub, 'r') as z:
                z.extractall(temp_dir)
                
            # 【終極智慧修正：同名同副檔名強行肉體覆蓋】
            for root, dirs, files in os.walk(temp_dir):
                for file in files:
                    f_lower = file.lower()
                    # 只要原書內部的舊圖片包含封面關鍵字
                    if f_lower.endswith(('.jpg', '.jpeg', '.png')):
                        if any(k in f_lower for k in ['cover', 'bookcover', 'front', 'bg', 'thumb', 'jacket']):
                            target_img_path = os.path.join(root, file)
                            
                            # 不管使用者丟進來的圖是 png 還是 jpg，直接肉體強行複製覆蓋原檔案的位置與原檔名
                            # 這樣就不會發生因為副檔名或大小寫不同而找不到檔案的 Bug！
                            shutil.copy2(user_image, target_img_path)
                            print(f'🎯 成功將新封面強制同名複製覆蓋舊封面檔案: {target_img_path}')
                            
            # 重新打包成覆蓋好新封面的橫排 EPUB
            os.remove(target_epub)
            with zipfile.ZipFile(target_epub, 'w', zipfile.ZIP_DEFLATED) as z_out:
                m_path = os.path.join(temp_dir, 'mimetype')
                if os.path.exists(m_path):
                    z_out.write(m_path, 'mimetype', compress_type=zipfile.ZIP_STORED)
                for root, dirs, files in os.walk(temp_dir):
                    for file in files:
                        fp = os.path.join(root, file)
                        an = os.path.relpath(fp, temp_dir)
                        if an != 'mimetype': z_out.write(fp, an)
            shutil.rmtree(temp_dir)
            print('🎉 原始橫排書之封面原圖同名替換成功，準備交由開源大腦轉直排！')
        "

        # 2. 呼叫開源大腦進行直排轉換
        for f in books/*.epub; do
          if [[ "$f" != *"-vertical.epub" ]]; then
            echo "正在以最初完美引號模式進行直排編碼: $f"
            epubhv "$f"
          fi
        done

    - name: 5. Upload Result (萬能搜刮下載路徑)
      uses: actions/upload-artifact@v4
      with:
        name: my-vertical-books
        path: |
          books/*
          *.epub
