name: EPUBHV Cloud Converter

on:
  push:
    paths:
      - 'books/**.epub'
  workflow_dispatch: # 新增：允許手動點擊按鈕強制轉檔

jobs:
  convert-to-vertical:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clone Code
      uses: actions/checkout@v4

    - name: 2. Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install epubhv
      run: |
        python -m pip install --upgrade pip
        pip install epubhv

    - name: 4. Transform to Vertical
      run: |
        for f in books/*.epub; do
          if [[ "$f" != *"_v.epub" ]]; then
            echo "Converting: $f"
            epubhv "$f"
          fi
        done

    - name: 5. Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: my-vertical-books
        path: books/*_v.epub
