name: EPUBHV Cloud Converter

on:
  push:
    paths:
      - 'books/**'

jobs:
  convert-to-vertical:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clone Code
      uses: actions/checkout@v4

    - name: 2. Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install epubhv (最原始成功的開源大腦)
      run: |
        python -m pip install --upgrade pip
        pip install epubhv

    - name: 4. Core Processing (原樣套件轉直排 -> 完工後最終暴力掉包封面)
      run: |
        # 1. 讓您原封不動、最完美的直排指令先完整跑完
        for f in books/*.epub; do
          if [[ "$f" != *"-vertical.epub" ]]; then
            echo "正在以最初完美引號模式進行直排編碼: $f"
            epubhv "$f"
          fi
        done

        # 2. 轉檔完畢！立刻執行最終暴力掉包與休眠防變形控制
        python -c "
        import os, zipfile, shutil
        
        # 尋找使用者上傳的新封面圖片與剛剛套件轉好的直排書
        user_image = None
        v_epub = None
        for f in os.listdir('books'):
            if f.lower().endswith(('.jpg', '.jpeg', '.png')):
                user_image = os.path.join('books', f)
            elif f.lower().endswith('-vertical.epub'):
                v_epub = os.path.join('books', f)
                
        if user_image and v_epub:
            print(f'⚡ 偵測到轉檔完畢，開始對直排書進行最終暴力掉包：{v_epub}')
            temp_dir = 'final_workspace'
            if os.path.exists(temp_dir): shutil.rmtree(temp_dir)
            with zipfile.ZipFile(v_epub, 'r') as z:
                z.extractall(temp_dir)
            
            # 【地毯式全面掉包】不管原書圖片叫什麼名字，只要有圖片，一律肉體覆蓋
            for root, dirs, files in os.walk(temp_dir):
                for file in files:
                    if file.lower().endswith(('.jpg', '.jpeg', '.png')):
                        # 只要檔名含有 cover、front、bg、thumb 或是任何可能是封面的字眼
                        if any(k in file.lower() for k in ['cover', 'bookcover', 'front', 'bg', 'thumb', 'jacket', '00001', 'page001']):
                            target_img_path = os.path.join(root, file)
                            shutil.copy2(user_image, target_img_path)
                            print(f'💥 已暴力覆蓋潛在舊封面圖片檔: {file}')

            # 【防變形鎖注入】地毯式搜索可能用來顯示封面的 HTML 網頁
            for root, dirs, files in os.walk(temp_dir):
                for file in files:
                    if file.lower().endswith(('.html', '.xhtml', '.htm')):
                        html_path = os.path.join(root, file)
                        with open(html_path, 'r', encoding='utf-8', errors='ignore') as f_h:
                            h_content = f_h.read()
                        
                        # 只要網頁跟封面有關，或者裡面有包 svg、img 標籤
                        if 'cover' in file.lower() or '<svg' in h_content or 'cover' in h_content.lower():
                            # 強行切斷限制比例的語法
                            h_content = h_content.replace('preserveAspectRatio=\"xMidYMid meet\"', 'preserveAspectRatio=\"none\"')
                            h_content = h_content.replace('preserveAspectRatio=\"xMidYMid\"', 'preserveAspectRatio=\"none\"')
                            
                            # 強制注入滿版 CSS
                            if '</head>' in h_content:
                                fix_style = '<style>html, body { margin:0 !important; padding:0 !important; width:100% !important; height:100% !important; overflow:hidden; } svg { width:100% !important; height:100% !important; object-fit: fill !important; } img { width:100% !important; height:100% !important; object-fit: fill !important; }</style></head>'
                                h_content = h_content.replace('</head>', fix_style)
                            
                            with open(html_path, 'w', encoding='utf-8') as f_h_w:
                                f_h_w.write(h_content)
                            print(f'🔧 已成功為封面網頁注入防變形控制鎖: {file}')

            # 3. 重新無損封裝回最完美的直排 EPUB
            os.remove(v_epub)
            with zipfile.ZipFile(v_epub, 'w', zipfile.ZIP_DEFLATED) as z_out:
                m_path = os.path.join(temp_dir, 'mimetype')
                if os.path.exists(m_path):
                    z_out.write(m_path, 'mimetype', compress_type=zipfile.ZIP_STORED)
                for root, dirs, files in os.walk(temp_dir):
                    for file in files:
                        fp = os.path.join(root, file)
                        an = os.path.relpath(fp, temp_dir)
                        if an != 'mimetype': z_out.write(fp, an)
            shutil.rmtree(temp_dir)
            print('🎉 最終成品無損掉包與防變形重新打包完成！')
        "

    - name: 5. Upload Result (萬能搜刮下載路徑)
      uses: actions/upload-artifact@v4
      with:
        name: my-vertical-books
        path: |
          books/*
          *.epub
